# For more details on how to configure Wrangler, refer to:
# https://developers.cloudflare.com/workers/wrangler/configuration/

name = "brickui"
compatibility_date = "2025-11-25"
main = "./build/index.js"

workers_dev = true
preview_urls = true

routes = [
  { pattern = "brickui.app", custom_domain = true }
]

#[build]
#command = "cargo install -q worker-build && worker-build --config ./wrangler.toml"
#cwd = "."
#watch_dir = "."

[assets]
directory = "./dist/client"
not_found_handling = "single-page-application"
binding = "ASSETS"
run_worker_first = [ "/api/*" ]

[observability]
enabled = true

[placement]
mode = "smart"

[[ratelimits]]
name = "API_RL"
namespace_id = "0"
simple = { limit = 10, period = 10 }

# Environment Variables
# https://developers.cloudflare.com/workers/configuration/#environment-variables
[vars]
WORKER_ENV = "production"

GOOGLE_REDIRECT_URI = "https://brickui.app/api/auth/register/google/callback"
SUPABASE_URL = "https://gbsgahfgkgjlhtvgwtur.supabase.co"

GITHUB_OWNER = "BrickUIApp"
GITHUB_REPO = "BrickUIApp"

[env.dev.vars]
WORKER_ENV = "dev"

GOOGLE_REDIRECT_URI = "https://brickui.app/api/auth/register/google/callback"
SUPABASE_URL = "https://gbsgahfgkgjlhtvgwtur.supabase.co"

GITHUB_OWNER = "BrickUIApp"
GITHUB_REPO = "BrickUIApp"

[env.production.vars]
WORKER_ENV = "production"

GOOGLE_REDIRECT_URI = "https://brickui.app/api/auth/register/google/callback"
SUPABASE_URL = "https://gbsgahfgkgjlhtvgwtur.supabase.co"

GITHUB_OWNER = "BrickUIApp"
GITHUB_REPO = "BrickUIApp"

#[env.production.limits]
#cpu_ms = 1000

# Note: Use secrets to store sensitive data.
# https://developers.cloudflare.com/workers/configuration/secrets/

# Service Bindings (communicate between multiple Workers)
