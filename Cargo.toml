[package]
name = "brickui-web"
version = "0.1.0"
edition = "2024"
authors = [ 
    "GitGinocchio <giuliotognetto0208@gmail.com>",
    "ildesh <deshbertolesh@gmail.com>"
]

[package.metadata.release]
release = false

# https://github.com/rustwasm/wasm-pack/issues/1247
[package.metadata.wasm-pack.profile.release]
wasm-opt = false

[lib]
path="./src/worker/lib.rs"
crate-type = ["cdylib"]

[build-dependencies]
wasm-bindgen = "0.2.106"

[dependencies]
worker = { version="0.7.1" }
worker-macros = { version="0.7.1" }
console_error_panic_hook = { version = "0.1.1" }
http = "1.4.0"
serde_json = "1.0.140"
base64 = "0.22.1"
serde = "1.0.228"
reqwest = { version = "0.12.24" }
infer = "0.19.0"
serde_yaml = "0.9.34"
urlencoding = "2.1.3"
chrono = "0.4.42"
once_cell = "1.21.3"

[dev-dependencies]
worker-build = "0.7.1"
