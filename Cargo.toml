[package]
name = "brickui-web"
version = "0.1.0"
edition = "2021"
authors = [ 
    "GitGinocchio <giuliotognetto0208@gmail.com>",
    "ildesh <deshbertolesh@gmail.com>"
]

[package.metadata.release]
release = false

# https://github.com/rustwasm/wasm-pack/issues/1247
[package.metadata.wasm-pack.profile.release]
wasm-opt = false

[lib]
path="./src/worker/lib.rs"
crate-type = ["cdylib"]

[dependencies]
worker = { version="0.7.0" }
worker-macros = { version="0.7.0" }
console_error_panic_hook = { version = "0.1.1" }
http = "1.4.0"
serde_json = "1.0.140"
base64 = "0.22.1"
serde = "1.0.228"
reqwest = { version = "0.12.24" }

[dev-dependencies]
worker-build = "0.7.0"